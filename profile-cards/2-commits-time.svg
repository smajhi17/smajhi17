<svg xmlns="http://www.w3.org/2000/svg" width="415" height="215" viewBox="0 0 415 215">
  <defs>
    <linearGradient id="cardBgTime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="timeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="barPeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="413" height="213" rx="16" fill="url(#cardBgTime)" stroke="url(#timeBorder)" stroke-width="1.8" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Header -->
    <text x="26" y="38" fill="#10B981" font-size="16" font-weight="700" letter-spacing="0.5">🕒 Productivity by Hour (IST)</text>

    <!-- Y-Axis Scale -->
    <g font-size="9.5" fill="#475569" text-anchor="end">
      <text x="36" y="68">50</text>
      <text x="36" y="96">35</text>
      <text x="36" y="124">20</text>
      <text x="36" y="152">10</text>
      <text x="36" y="178">0</text>
    </g>

    <!-- Subtle Guides -->
    <line x1="44" y1="65" x2="390" y2="65" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="44" y1="93" x2="390" y2="93" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="44" y1="121" x2="390" y2="121" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="44" y1="149" x2="390" y2="149" stroke="#1E293B" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="44" y1="175" x2="390" y2="175" stroke="#334155" stroke-width="1" />

    <!-- 24 Hour Bars -->
    <g>
      <!-- 00-06 -->
      <rect x="48" y="171" width="9" height="4" rx="2" fill="url(#barGrad)" />
      <rect x="62" y="173" width="9" height="2" rx="2" fill="url(#barGrad)" />
      <rect x="76" y="174" width="9" height="1" rx="2" fill="url(#barGrad)" />
      <rect x="90" y="175" width="9" height="0" rx="2" fill="url(#barGrad)" />
      <rect x="104" y="175" width="9" height="0" rx="2" fill="url(#barGrad)" />
      <rect x="118" y="174" width="9" height="1" rx="2" fill="url(#barGrad)" />

      <!-- 06-12 -->
      <rect x="132" y="167" width="9" height="8" rx="2" fill="url(#barGrad)" />
      <rect x="146" y="157" width="9" height="18" rx="2" fill="url(#barGrad)" />
      <rect x="160" y="148" width="9" height="27" rx="2" fill="url(#barGrad)" />
      <rect x="174" y="132" width="9" height="43" rx="2" fill="url(#barGrad)" />
      <rect x="188" y="118" width="9" height="57" rx="2" fill="url(#barGrad)" />
      <rect x="202" y="110" width="9" height="65" rx="2" fill="url(#barGrad)" />

      <!-- 12-18 -->
      <rect x="216" y="100" width="9" height="75" rx="2" fill="url(#barGrad)" />
      <rect x="230" y="92" width="9" height="83" rx="2" fill="url(#barGrad)" />
      <rect x="244" y="80" width="9" height="95" rx="2" fill="url(#barGrad)" />
      <rect x="258" y="70" width="9" height="105" rx="2" fill="url(#barPeakGrad)" />
      <rect x="272" y="58" width="9" height="117" rx="2" fill="url(#barPeakGrad)" />
      <rect x="286" y="52" width="9" height="123" rx="2" fill="url(#barPeakGrad)" />

      <!-- 18-24 (Peak Late Coding) -->
      <rect x="300" y="46" width="9" height="129" rx="2" fill="url(#barPeakGrad)" />
      <rect x="314" y="54" width="9" height="121" rx="2" fill="url(#barPeakGrad)" />
      <rect x="328" y="72" width="9" height="103" rx="2" fill="url(#barGrad)" />
      <rect x="342" y="98" width="9" height="77" rx="2" fill="url(#barGrad)" />
      <rect x="356" y="130" width="9" height="45" rx="2" fill="url(#barGrad)" />
      <rect x="370" y="155" width="9" height="20" rx="2" fill="url(#barGrad)" />
    </g>

    <!-- X-Axis Labels -->
    <g font-size="10.5" fill="#64748B" text-anchor="middle">
      <text x="52" y="194">0h</text>
      <text x="136" y="194">6h</text>
      <text x="220" y="194">12h</text>
      <text x="305" y="194">18h</text>
      <text x="375" y="194">23h</text>
    </g>
  </g>
</svg>
