<svg xmlns="http://www.w3.org/2000/svg" width="415" height="215" viewBox="0 0 415 215">
  <defs>
    <linearGradient id="cardBgLangs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="langsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="413" height="213" rx="16" fill="url(#cardBgLangs)" stroke="url(#langsBorder)" stroke-width="1.8" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Title -->
    <text x="26" y="38" fill="#A78BFA" font-size="16" font-weight="700" letter-spacing="0.5">📦 Languages by Repo</text>

    <!-- Legend & Progress Bars (Left) -->
    <g transform="translate(26, 60)">
      <!-- Java -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#F59E0B" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Java</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">45%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="58" height="4" rx="2" fill="#F59E0B" />
      </g>

      <!-- Kotlin -->
      <g transform="translate(0, 28)">
        <circle cx="5" cy="5" r="4" fill="#A855F7" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Kotlin</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">25%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="32" height="4" rx="2" fill="#A855F7" />
      </g>

      <!-- Python -->
      <g transform="translate(0, 56)">
        <circle cx="5" cy="5" r="4" fill="#38BDF8" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Python</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">18%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="23" height="4" rx="2" fill="#38BDF8" />
      </g>

      <!-- JavaScript -->
      <g transform="translate(0, 84)">
        <circle cx="5" cy="5" r="4" fill="#EAB308" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">JavaScript</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">8%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="11" height="4" rx="2" fill="#EAB308" />
      </g>

      <!-- HTML & Others -->
      <g transform="translate(0, 112)">
        <circle cx="5" cy="5" r="4" fill="#F43F5E" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">HTML &amp; Other</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">4%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="6" height="4" rx="2" fill="#F43F5E" />
      </g>
    </g>

    <!-- Glowing Donut Ring (Right) cx=295, cy=120, r=58, hole=34 -->
    <g transform="translate(295, 120)">
      <!-- Java: 45% (0 to 162 deg) -->
      <path d="M 0,-58 A 58 58 0 0 1 18,55 L 10,32 A 34 34 0 0 0 0,-34 Z" fill="#F59E0B" />
      <!-- Kotlin: 25% (162 to 252 deg) -->
      <path d="M 18,55 A 58 58 0 0 1 -55,18 L -32,10 A 34 34 0 0 0 10,32 Z" fill="#A855F7" />
      <!-- Python: 18% (252 to 316 deg) -->
      <path d="M -55,18 A 58 58 0 0 1 -40,-42 L -23,-24 A 34 34 0 0 0 -32,10 Z" fill="#38BDF8" />
      <!-- JavaScript: 8% (316 to 345 deg) -->
      <path d="M -40,-42 A 58 58 0 0 1 -15,-56 L -9,-33 A 34 34 0 0 0 -23,-24 Z" fill="#EAB308" />
      <!-- HTML: 4% (345 to 360 deg) -->
      <path d="M -15,-56 A 58 58 0 0 1 0,-58 L 0,-34 A 34 34 0 0 0 -9,-33 Z" fill="#F43F5E" />

      <!-- Center Logo / Icon -->
      <circle cx="0" cy="0" r="26" fill="#0B0E17" />
      <polygon points="0,-10 8,5 -8,5" fill="#A78BFA" opacity="0.8" />
    </g>
  </g>
</svg>
