<svg xmlns="http://www.w3.org/2000/svg" width="415" height="215" viewBox="0 0 415 215">
  <defs>
    <linearGradient id="cardBgCommit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="commitBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="413" height="213" rx="16" fill="url(#cardBgCommit)" stroke="url(#commitBorder)" stroke-width="1.8" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Title -->
    <text x="26" y="38" fill="#38BDF8" font-size="16" font-weight="700" letter-spacing="0.5">💻 Languages by Commits</text>

    <!-- Legend & Progress Bars (Left) -->
    <g transform="translate(26, 60)">
      <!-- Java -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#F59E0B" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Java</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">48%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="62" height="4" rx="2" fill="#F59E0B" />
      </g>

      <!-- Kotlin -->
      <g transform="translate(0, 28)">
        <circle cx="5" cy="5" r="4" fill="#A855F7" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Kotlin</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">28%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="36" height="4" rx="2" fill="#A855F7" />
      </g>

      <!-- JavaScript -->
      <g transform="translate(0, 56)">
        <circle cx="5" cy="5" r="4" fill="#EAB308" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">JavaScript</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">12%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="16" height="4" rx="2" fill="#EAB308" />
      </g>

      <!-- Python -->
      <g transform="translate(0, 84)">
        <circle cx="5" cy="5" r="4" fill="#38BDF8" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Python</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">8%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="10" height="4" rx="2" fill="#38BDF8" />
      </g>

      <!-- Other -->
      <g transform="translate(0, 112)">
        <circle cx="5" cy="5" r="4" fill="#10B981" />
        <text x="16" y="9" fill="#E2E8F0" font-size="12.5" font-weight="600">Other</text>
        <text x="145" y="9" fill="#94A3B8" font-size="11.5" text-anchor="end">4%</text>
        <rect x="16" y="14" width="130" height="4" rx="2" fill="#1E293B" />
        <rect x="16" y="14" width="5" height="4" rx="2" fill="#10B981" />
      </g>
    </g>

    <!-- Glowing Donut Ring (Right) cx=295, cy=120, r=58, hole=34 -->
    <g transform="translate(295, 120)">
      <!-- Java: 48% (0 to 173 deg) -->
      <path d="M 0,-58 A 58 58 0 0 1 7,57 L 4,33 A 34 34 0 0 0 0,-34 Z" fill="#F59E0B" />
      <!-- Kotlin: 28% (173 to 274 deg) -->
      <path d="M 7,57 A 58 58 0 0 1 -58,-4 L -34,-2 A 34 34 0 0 0 4,33 Z" fill="#A855F7" />
      <!-- JavaScript: 12% (274 to 317 deg) -->
      <path d="M -58,-4 A 58 58 0 0 1 -40,-42 L -23,-24 A 34 34 0 0 0 -34,-2 Z" fill="#EAB308" />
      <!-- Python: 8% (317 to 346 deg) -->
      <path d="M -40,-42 A 58 58 0 0 1 -14,-56 L -8,-33 A 34 34 0 0 0 -23,-24 Z" fill="#38BDF8" />
      <!-- Other: 4% (346 to 360 deg) -->
      <path d="M -14,-56 A 58 58 0 0 1 0,-58 L 0,-34 A 34 34 0 0 0 -8,-33 Z" fill="#10B981" />

      <!-- Center Logo / Icon -->
      <circle cx="0" cy="0" r="26" fill="#0B0E17" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#38BDF8" stroke-width="2" />
    </g>
  </g>
</svg>
