<svg xmlns="http://www.w3.org/2000/svg" width="390" height="200" viewBox="0 0 390 200">
  <!-- Card Background -->
  <rect width="390" height="200" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="25" y="38" fill="#58a6ff" font-size="17" font-weight="600">Top Languages by Commit</text>

    <!-- Legend Items (Left) -->
    <g transform="translate(25, 62)">
      <!-- Java -->
      <g transform="translate(0, 0)">
        <rect x="0" y="2" width="10" height="10" rx="2" fill="#b07219" />
        <text x="18" y="11" fill="#8b949e" font-size="13">Java</text>
      </g>
      <!-- Kotlin -->
      <g transform="translate(0, 24)">
        <rect x="0" y="2" width="10" height="10" rx="2" fill="#a97bff" />
        <text x="18" y="11" fill="#8b949e" font-size="13">Kotlin</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(0, 48)">
        <rect x="0" y="2" width="10" height="10" rx="2" fill="#f1e05a" />
        <text x="18" y="11" fill="#8b949e" font-size="13">JavaScript</text>
      </g>
      <!-- Python -->
      <g transform="translate(0, 72)">
        <rect x="0" y="2" width="10" height="10" rx="2" fill="#3572A5" />
        <text x="18" y="11" fill="#8b949e" font-size="13">Python</text>
      </g>
      <!-- CSS -->
      <g transform="translate(0, 96)">
        <rect x="0" y="2" width="10" height="10" rx="2" fill="#563d7c" />
        <text x="18" y="11" fill="#8b949e" font-size="13">CSS</text>
      </g>
    </g>

    <!-- Donut Chart (Right) cx=275, cy=115, r=55, hole=32 -->
    <g transform="translate(275, 115)">
      <!-- Java: 48% (0 to 173 deg) -->
      <path d="M 0,-55 A 55 55 0 0 1 7,54 L 4,31 A 32 32 0 0 0 0,-32 Z" fill="#b07219" />
      <!-- Kotlin: 28% (173 to 274 deg) -->
      <path d="M 7,54 A 55 55 0 0 1 -55,-4 L -32,-2 A 32 32 0 0 0 4,31 Z" fill="#a97bff" />
      <!-- JavaScript: 12% (274 to 317 deg) -->
      <path d="M -55,-4 A 55 55 0 0 1 -37,-40 L -21,-23 A 32 32 0 0 0 -32,-2 Z" fill="#f1e05a" />
      <!-- Python: 8% (317 to 346 deg) -->
      <path d="M -37,-40 A 55 55 0 0 1 -13,-53 L -8,-31 A 32 32 0 0 0 -21,-23 Z" fill="#3572A5" />
      <!-- CSS: 4% (346 to 360 deg) -->
      <path d="M -13,-53 A 55 55 0 0 1 0,-55 L 0,-32 A 32 32 0 0 0 -8,-31 Z" fill="#563d7c" />
    </g>
  </g>
</svg>
