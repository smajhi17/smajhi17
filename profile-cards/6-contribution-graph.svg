<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="240" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Title -->
    <text x="400" y="32" fill="#c9d1d9" font-size="15" font-weight="600" text-anchor="middle">Subhankar's Contribution Graph</text>

    <!-- Gridlines & Y-Axis labels -->
    <g font-size="10" fill="#484f58" text-anchor="end">
      <text x="45" y="70">6</text>
      <text x="45" y="110">4</text>
      <text x="45" y="150">2</text>
      <text x="45" y="190">0</text>
    </g>

    <!-- Horizontal Gridlines -->
    <line x1="55" y1="66" x2="755" y2="66" stroke="#161b22" stroke-width="1" />
    <line x1="55" y1="106" x2="755" y2="106" stroke="#161b22" stroke-width="1" />
    <line x1="55" y1="146" x2="755" y2="146" stroke="#161b22" stroke-width="1" />
    <line x1="55" y1="186" x2="755" y2="186" stroke="#21262d" stroke-width="1" />

    <!-- Vertical Gridlines -->
    <line x1="120" y1="50" x2="120" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="225" y1="50" x2="225" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="330" y1="50" x2="330" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="435" y1="50" x2="435" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="540" y1="50" x2="540" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="645" y1="50" x2="645" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="750" y1="50" x2="750" y2="186" stroke="#161b22" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Spline Area Fill -->
    <path d="M 55,186 L 80,175 Q 120,185 150,165 T 220,130 Q 250,90 280,60 Q 300,55 320,110 T 380,160 Q 420,175 460,110 Q 480,75 510,140 T 580,170 Q 620,115 650,85 Q 675,70 700,120 T 755,175 L 755,186 Z" fill="url(#curveFill)" />

    <!-- Smooth Spline Line -->
    <path d="M 55,186 L 80,175 Q 120,185 150,165 T 220,130 Q 250,90 280,60 Q 300,55 320,110 T 380,160 Q 420,175 460,110 Q 480,75 510,140 T 580,170 Q 620,115 650,85 Q 675,70 700,120 T 755,175" fill="none" stroke="#3fb950" stroke-width="2.5" />

    <!-- Glowing Data Points -->
    <circle cx="280" cy="60" r="4" fill="#3fb950" stroke="#0d1117" stroke-width="2" />
    <circle cx="480" cy="75" r="4" fill="#3fb950" stroke="#0d1117" stroke-width="2" />
    <circle cx="650" cy="85" r="4" fill="#3fb950" stroke="#0d1117" stroke-width="2" />

    <!-- X-Axis Month Labels -->
    <g font-size="11" fill="#6e7681" text-anchor="middle">
      <text x="80" y="210">Nov</text>
      <text x="180" y="210">Jan</text>
      <text x="280" y="210">Mar</text>
      <text x="380" y="210">May</text>
      <text x="480" y="210">Jul</text>
      <text x="580" y="210">Sep</text>
      <text x="680" y="210">Oct</text>
    </g>
  </g>
</svg>
