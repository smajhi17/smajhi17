<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250">
  <defs>
    <linearGradient id="cardBgGraph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="graphBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="momentumArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glowPoint" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="848" height="248" rx="16" fill="url(#cardBgGraph)" stroke="url(#graphBorder)" stroke-width="1.8" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Header -->
    <text x="425" y="34" fill="#F8FAFC" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">Subhankar's Contribution Momentum</text>

    <!-- Y-Axis Scale -->
    <g font-size="10" fill="#475569" text-anchor="end">
      <text x="50" y="72">30</text>
      <text x="50" y="112">20</text>
      <text x="50" y="152">10</text>
      <text x="50" y="192">0</text>
    </g>

    <!-- Horizontal Laser Guides -->
    <line x1="60" y1="68" x2="800" y2="68" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="60" y1="108" x2="800" y2="108" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="60" y1="148" x2="800" y2="148" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="60" y1="188" x2="800" y2="188" stroke="#334155" stroke-width="1" />

    <!-- Vertical Timeline Guides -->
    <line x1="165" y1="55" x2="165" y2="188" stroke="#161F2E" stroke-width="1" />
    <line x1="290" y1="55" x2="290" y2="188" stroke="#161F2E" stroke-width="1" />
    <line x1="415" y1="55" x2="415" y2="188" stroke="#161F2E" stroke-width="1" />
    <line x1="540" y1="55" x2="540" y2="188" stroke="#161F2E" stroke-width="1" />
    <line x1="665" y1="55" x2="665" y2="188" stroke="#161F2E" stroke-width="1" />

    <!-- Momentum Area Fill -->
    <path d="M 60,188 L 90,178 Q 130,185 165,168 T 240,135 Q 275,95 310,58 Q 330,52 355,115 T 425,162 Q 465,178 505,112 Q 530,78 560,142 T 640,172 Q 680,118 715,82 Q 740,68 765,122 T 800,176 L 800,188 Z" fill="url(#momentumArea)" />

    <!-- Smooth Spline Stroke Line -->
    <path d="M 60,188 L 90,178 Q 130,185 165,168 T 240,135 Q 275,95 310,58 Q 330,52 355,115 T 425,162 Q 465,178 505,112 Q 530,78 560,142 T 640,172 Q 680,118 715,82 Q 740,68 765,122 T 800,176" fill="none" stroke="#10B981" stroke-width="2.8" />

    <!-- Glowing Peak Pulse Rings & Dots -->
    <circle cx="310" cy="58" r="8" fill="#38BDF8" opacity="0.25" filter="url(#glowPoint)" />
    <circle cx="310" cy="58" r="4.5" fill="#38BDF8" stroke="#0B0E17" stroke-width="2" />

    <circle cx="505" cy="112" r="7" fill="#10B981" opacity="0.25" filter="url(#glowPoint)" />
    <circle cx="505" cy="112" r="4" fill="#10B981" stroke="#0B0E17" stroke-width="2" />

    <circle cx="715" cy="82" r="8" fill="#38BDF8" opacity="0.25" filter="url(#glowPoint)" />
    <circle cx="715" cy="82" r="4.5" fill="#38BDF8" stroke="#0B0E17" stroke-width="2" />

    <!-- X-Axis Month Indicators -->
    <g font-size="11" fill="#64748B" text-anchor="middle">
      <text x="100" y="212">Nov</text>
      <text x="215" y="212">Jan</text>
      <text x="330" y="212">Mar</text>
      <text x="445" y="212">May</text>
      <text x="560" y="212">Jul</text>
      <text x="675" y="212">Sep</text>
      <text x="770" y="212">Oct</text>
    </g>
  </g>
</svg>
