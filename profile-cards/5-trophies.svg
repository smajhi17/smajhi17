<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <linearGradient id="cardBgTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="trophyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="trophyEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="trophyCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="trophyPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="trophySilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Border Gradients for Cards -->
    <linearGradient id="bGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Trophy 1: MultiLanguage (Rank S) -->
    <g transform="translate(0, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bPurple)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">MultiLanguage</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyPurpleGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyPurpleGrad)" font-size="22" font-weight="800" text-anchor="middle">S</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">Rainbow Master</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">Tier 1</text>
    </g>

    <!-- Trophy 2: Repositories (Rank S) -->
    <g transform="translate(143, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bGold)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">Repositories</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyGoldGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyGoldGrad)" font-size="22" font-weight="800" text-anchor="middle">S</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">Repo Architect</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">115pt</text>
    </g>

    <!-- Trophy 3: Stars (Rank S) -->
    <g transform="translate(286, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bGold)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">Stars</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyGoldGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyGoldGrad)" font-size="22" font-weight="800" text-anchor="middle">S</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">Stargazer</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">204pt</text>
    </g>

    <!-- Trophy 4: Commits (Rank S) -->
    <g transform="translate(429, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bEmerald)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">Commits</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyEmeraldGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyEmeraldGrad)" font-size="22" font-weight="800" text-anchor="middle">S</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">Ultra Committer</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">180pt</text>
    </g>

    <!-- Trophy 5: Followers (Rank A) -->
    <g transform="translate(572, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bCyan)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">Community</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyCyanGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyCyanGrad)" font-size="22" font-weight="800" text-anchor="middle">A</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">Network Builder</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">Top 5%</text>
    </g>

    <!-- Trophy 6: PullRequest (Rank A) -->
    <g transform="translate(715, 0)">
      <rect width="134" height="120" rx="14" fill="url(#cardBgTrophy)" stroke="url(#bPurple)" stroke-width="1.6" />
      <text x="67" y="24" fill="#E2E8F0" font-size="11.5" font-weight="600" text-anchor="middle">PullRequest</text>
      <circle cx="67" cy="58" r="21" fill="none" stroke="url(#trophyPurpleGrad)" stroke-width="2.5" />
      <text x="67" y="66" fill="url(#trophyPurpleGrad)" font-size="22" font-weight="800" text-anchor="middle">A</text>
      <text x="67" y="98" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">PR Contributor</text>
      <text x="67" y="110" fill="#475569" font-size="8.5" text-anchor="middle">Active</text>
    </g>
  </g>
</svg>
