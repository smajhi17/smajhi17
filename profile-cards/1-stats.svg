<svg xmlns="http://www.w3.org/2000/svg" width="415" height="215" viewBox="0 0 415 215">
  <defs>
    <linearGradient id="cardBgStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="413" height="213" rx="16" fill="url(#cardBgStats)" stroke="url(#statsBorder)" stroke-width="1.8" />

  <!-- Octocat Watermark Silhouette -->
  <g transform="translate(255, 45) scale(1.15)" opacity="0.12" fill="#38BDF8">
    <path d="M 50 0 C 22.4 0 0 22.4 0 50 C 0 72.1 14.3 90.8 34.2 97.4 C 36.7 97.9 37.6 96.3 37.6 95 C 37.6 93.9 37.5 89.8 37.5 85.7 C 23.6 88.7 20.7 79.7 20.7 79.7 C 18.4 73.9 15.1 72.3 15.1 72.3 C 10.6 69.2 15.4 69.3 15.4 69.3 C 20.4 69.6 23 74.4 23 74.4 C 27.4 81.9 34.6 79.8 37.4 78.5 C 37.8 75.3 39.1 73.1 40.5 71.9 C 29.4 70.6 17.7 66.3 17.7 47.1 C 17.7 41.6 19.7 37.1 22.9 33.6 C 22.4 32.3 20.7 27.2 23.4 20.3 C 23.4 20.3 27.6 19 37.1 25.4 C 41.1 24.3 45.4 23.7 49.7 23.7 C 54 23.7 58.3 24.3 62.3 25.4 C 71.8 19 76 20.3 76 20.3 C 78.7 27.2 77 32.3 76.5 33.6 C 79.7 37.1 81.7 41.6 81.7 47.1 C 81.7 66.4 70 70.6 58.8 71.8 C 60.6 73.4 62.2 76.5 62.2 81.2 C 62.2 87.9 62.1 93.4 62.1 95 C 62.1 96.3 63 97.9 65.5 97.4 C 85.4 90.8 99.7 72.1 99.7 50 C 99.7 22.4 77.3 0 49.7 0 Z" />
  </g>

  <!-- Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="26" y="38" fill="#38BDF8" font-size="16" font-weight="700" letter-spacing="0.5">⚡ GitHub Stats</text>

    <!-- Star Metric -->
    <g transform="translate(26, 62)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#78350F" opacity="0.4" />
      <polygon points="11,4 13,8 18,9 14,13 15,18 11,15 7,18 8,13 4,9 9,8" fill="#F59E0B" />
      <text x="32" y="15" fill="#94A3B8" font-size="13" font-weight="500">Total Stars</text>
      <text x="175" y="15" fill="#F8FAFC" font-size="14" font-weight="700">18</text>
    </g>

    <!-- Commits Metric -->
    <g transform="translate(26, 92)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#064E3B" opacity="0.4" />
      <circle cx="11" cy="11" r="5" fill="none" stroke="#10B981" stroke-width="2" />
      <text x="32" y="15" fill="#94A3B8" font-size="13" font-weight="500">Total Commits</text>
      <text x="175" y="15" fill="#F8FAFC" font-size="14" font-weight="700">320+</text>
    </g>

    <!-- PRs Metric -->
    <g transform="translate(26, 122)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#581C87" opacity="0.4" />
      <circle cx="8" cy="8" r="2.5" fill="none" stroke="#A855F7" stroke-width="1.8" />
      <circle cx="8" cy="14" r="2.5" fill="none" stroke="#A855F7" stroke-width="1.8" />
      <path d="M 8,8 L 8,14" stroke="#A855F7" stroke-width="1.8" />
      <text x="32" y="15" fill="#94A3B8" font-size="13" font-weight="500">Pull Requests</text>
      <text x="175" y="15" fill="#F8FAFC" font-size="14" font-weight="700">14</text>
    </g>

    <!-- Issues Metric -->
    <g transform="translate(26, 152)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#0E7490" opacity="0.4" />
      <circle cx="11" cy="11" r="5" fill="none" stroke="#06B6D4" stroke-width="2" />
      <circle cx="11" cy="11" r="1.5" fill="#06B6D4" />
      <text x="32" y="15" fill="#94A3B8" font-size="13" font-weight="500">Issues Solved</text>
      <text x="175" y="15" fill="#F8FAFC" font-size="14" font-weight="700">6</text>
    </g>

    <!-- Contributed To Metric -->
    <g transform="translate(26, 182)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#1E3A8A" opacity="0.4" />
      <rect x="5" y="5" width="12" height="12" rx="3" fill="none" stroke="#3B82F6" stroke-width="1.8" />
      <text x="32" y="15" fill="#94A3B8" font-size="13" font-weight="500">Contributed Repos</text>
      <text x="175" y="15" fill="#F8FAFC" font-size="14" font-weight="700">24+</text>
    </g>
  </g>
</svg>
