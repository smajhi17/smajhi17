<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Chart Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Card Background with Gradient Border -->
  <rect x="1" y="1" width="848" height="218" rx="16" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Left Info Column -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif">
    <!-- User Name & Status Badge -->
    <text x="32" y="44" fill="#F8FAFC" font-size="21" font-weight="700" letter-spacing="0.5">Subhankar Majhi</text>
    
    <!-- @smajhi17 Pill -->
    <rect x="215" y="27" width="92" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="261" y="42" fill="#38BDF8" font-size="11.5" font-weight="600" text-anchor="middle">@smajhi17</text>

    <!-- Detail 1: Contributions -->
    <g transform="translate(32, 74)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="#064E3B" opacity="0.6" />
      <circle cx="14" cy="14" r="5" fill="none" stroke="#34D399" stroke-width="2" />
      <text x="38" y="18" fill="#E2E8F0" font-size="13.5" font-weight="500">420+ Contributions <tspan fill="#64748B" font-size="12">(past year)</tspan></text>
    </g>

    <!-- Detail 2: Repositories -->
    <g transform="translate(32, 110)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="#1E1B4B" opacity="0.6" />
      <rect x="9" y="9" width="10" height="10" rx="2" fill="none" stroke="#818CF8" stroke-width="2" />
      <text x="38" y="18" fill="#E2E8F0" font-size="13.5" font-weight="500">14 Public Repositories</text>
    </g>

    <!-- Detail 3: Experience / Tenure -->
    <g transform="translate(32, 146)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="#312E81" opacity="0.5" />
      <circle cx="14" cy="14" r="5" fill="none" stroke="#A78BFA" stroke-width="2" />
      <text x="38" y="18" fill="#E2E8F0" font-size="13.5" font-weight="500">Active GitHub Contributor <tspan fill="#64748B" font-size="12">(4+ Years)</tspan></text>
    </g>

    <!-- Detail 4: Focus Area -->
    <g transform="translate(32, 182)">
      <rect x="0" y="0" width="28" height="28" rx="8" fill="#0C4A6E" opacity="0.5" />
      <polygon points="14,8 19,17 9,17" fill="none" stroke="#38BDF8" stroke-width="1.8" />
      <text x="38" y="18" fill="#94A3B8" font-size="12.5" font-weight="500">Android Development • Spring Boot • ML</text>
    </g>
  </g>

  <!-- Right Side: Glowing Modern Spline Wave Chart -->
  <g transform="translate(440, 24)">
    <!-- Header -->
    <text x="375" y="20" fill="#94A3B8" font-size="11.5" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Activity Velocity</text>
    
    <!-- Pulsing Live Dot -->
    <circle cx="265" cy="16" r="3.5" fill="#10B981" filter="url(#neonGlow)" />
    <text x="275" y="20" fill="#10B981" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">Active</text>

    <!-- Y-Axis Guides -->
    <g font-family="-apple-system, sans-serif" font-size="9.5" fill="#475569" text-anchor="end">
      <text x="375" y="52">300</text>
      <text x="375" y="87">200</text>
      <text x="375" y="122">100</text>
      <text x="375" y="157">0</text>
    </g>

    <!-- Gridlines -->
    <line x1="0" y1="48" x2="350" y2="48" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="0" y1="83" x2="350" y2="83" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="0" y1="118" x2="350" y2="118" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="0" y1="153" x2="350" y2="153" stroke="#334155" stroke-width="1" />

    <!-- Wave Area Fill -->
    <path d="M 0,153 Q 40,150 80,142 T 150,132 Q 185,100 220,45 Q 245,38 265,85 T 310,138 L 350,146 L 350,153 L 0,153 Z" fill="url(#waveGrad)" />

    <!-- Glowing Spline Line -->
    <path d="M 0,153 Q 40,150 80,142 T 150,132 Q 185,100 220,45 Q 245,38 265,85 T 310,138 L 350,146" fill="none" stroke="#10B981" stroke-width="2.8" filter="url(#neonGlow)" />

    <!-- Glowing Peak Points -->
    <circle cx="220" cy="45" r="4.5" fill="#38BDF8" stroke="#0B0E17" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="265" cy="85" r="4" fill="#10B981" stroke="#0B0E17" stroke-width="2" />

    <!-- X-Axis Months -->
    <g font-family="-apple-system, sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">
      <text x="25" y="172">May</text>
      <text x="95" y="172">Jul</text>
      <text x="165" y="172">Sep</text>
      <text x="235" y="172">Nov</text>
      <text x="305" y="172">Jan</text>
    </g>
  </g>
</svg>
