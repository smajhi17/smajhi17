<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="greenArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="200" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />

  <!-- Left Info Column -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="30" y="42" fill="#58a6ff" font-size="19" font-weight="600">Subhankar Majhi (smajhi17)</text>

    <!-- Stat 1: Contributions -->
    <g transform="translate(30, 72)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#8b949e" stroke-width="1.8" />
      <path d="M 8,4 L 8,8 L 11,10" fill="none" stroke="#8b949e" stroke-width="1.8" />
      <text x="24" y="12" fill="#c9d1d9" font-size="13.5">420+ Contributions in the last year</text>
    </g>

    <!-- Stat 2: Repos -->
    <g transform="translate(30, 102)">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="#8b949e" stroke-width="1.8" />
      <line x1="2" y1="6" x2="14" y2="6" stroke="#8b949e" stroke-width="1.5" />
      <text x="24" y="12" fill="#c9d1d9" font-size="13.5">14 Public Repositories</text>
    </g>

    <!-- Stat 3: Joined -->
    <g transform="translate(30, 132)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="#8b949e" stroke-width="1.8" />
      <text x="24" y="12" fill="#c9d1d9" font-size="13.5">Joined GitHub 4 years ago</text>
    </g>

    <!-- Stat 4: Handle -->
    <g transform="translate(30, 162)">
      <text x="2" y="12" fill="#8b949e" font-size="13.5">@</text>
      <text x="24" y="12" fill="#8b949e" font-size="13.5">@smajhi17</text>
    </g>
  </g>

  <!-- Right Chart Area -->
  <g transform="translate(420, 20)">
    <text x="350" y="20" fill="#8b949e" font-size="11" text-anchor="end">contributions in the last year</text>
    
    <!-- Y-axis scale -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#484f58" text-anchor="end">
      <text x="350" y="45">300</text>
      <text x="350" y="75">200</text>
      <text x="350" y="105">100</text>
      <text x="350" y="135">50</text>
    </g>

    <!-- Chart Gridlines -->
    <line x1="0" y1="42" x2="330" y2="42" stroke="#161b22" stroke-width="1" />
    <line x1="0" y1="72" x2="330" y2="72" stroke="#161b22" stroke-width="1" />
    <line x1="0" y1="102" x2="330" y2="102" stroke="#161b22" stroke-width="1" />
    <line x1="0" y1="132" x2="330" y2="132" stroke="#161b22" stroke-width="1" />

    <!-- Green Area & Curve -->
    <path d="M 0,135 Q 40,132 80,128 T 150,118 Q 180,95 210,40 Q 235,35 250,75 T 290,125 L 330,132 L 330,140 L 0,140 Z" fill="url(#greenArea)" />
    <path d="M 0,135 Q 40,132 80,128 T 150,118 Q 180,95 210,40 Q 235,35 250,75 T 290,125 L 330,132" fill="none" stroke="#3fb950" stroke-width="2.5" />

    <!-- X-axis Timeline Labels -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">
      <text x="20" y="156">24/05</text>
      <text x="90" y="156">24/07</text>
      <text x="160" y="156">24/09</text>
      <text x="230" y="156">24/11</text>
      <text x="300" y="156">25/01</text>
    </g>
  </g>
</svg>
